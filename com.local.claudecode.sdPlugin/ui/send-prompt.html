<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Code · Send Prompt</title>
  <link rel="stylesheet" href="./pi.css" />
  <script src="./vendor/sdpi-components.js"></script>
</head>
<body data-action="send-prompt">
  <sdpi-item label="Prompt">
    <sdpi-textarea setting="prompt" rows="4"></sdpi-textarea>
  </sdpi-item>
  <p class="cc-hint">Pasted into the selected chat and sent with Return. The key shows its first words.</p>
  <p class="cc-hint">Leave empty to send what you've typed in Claude's prompt box.</p>
  <div id="cc-status"></div>
  <script src="./pi.js"></script>
</body>
</html>
